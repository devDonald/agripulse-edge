name: AgriPulse CI/CD Release Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEFAULT_HOST: '52.0.227.75'
  DEFAULT_USER: 'ubuntu'

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Tests (Mock Mode)
        env:
          MOCK_MODE: 'true'
        run: |
          python -m pytest tests/ -v
          python scripts/test_stability_matrix.py

  deploy:
    name: Deploy to Graviton EC2 Production
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify SSH Credentials
        id: check_creds
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret EC2_SSH_KEY is missing. Please add your yanmata.pem private key to GitHub Repository Secrets."
            exit 1
          fi
          echo "SSH key found."

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST || env.DEFAULT_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Code & Update Container on EC2
        env:
          HOST: ${{ secrets.EC2_HOST || env.DEFAULT_HOST }}
          USER: ${{ secrets.EC2_USER || env.DEFAULT_USER }}
        run: |
          ssh $USER@$HOST << 'EOF'
            set -e
            echo "🚀 Updating AgriPulse Edge code on EC2..."
            cd /opt/agripulse/app

            # Pull latest git commit
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Building native ARM64 Docker container..."
            docker build -t agripulse-edge:latest .

            echo "🔄 Rolling container restart..."
            docker rm -f agripulse 2>/dev/null || true
            docker run -d \
              --name agripulse \
              --restart unless-stopped \
              --env-file /opt/agripulse/.env \
              -e PORT=8000 \
              -e WEB_CONCURRENCY=1 \
              -v /opt/agripulse/data:/data \
              -p 127.0.0.1:8000:8000 \
              agripulse-edge:latest

            echo "🔄 Ensuring Caddy is active..."
            sudo systemctl reload caddy || sudo systemctl restart caddy

            echo "🔍 Verifying internal health..."
            for i in {1..15}; do
              if curl -s http://127.0.0.1:8000/health | grep -q "healthy"; then
                echo "✅ AgriPulse container is healthy and responding!"
                exit 0
              fi
              echo "Waiting for container startup ($i/15)..."
              sleep 2
            done

            echo "❌ Health check timed out"
            docker logs --tail 40 agripulse
            exit 1
          EOF

      - name: Verify Live Endpoints
        env:
          HOST: ${{ secrets.EC2_HOST || env.DEFAULT_HOST }}
          USER: ${{ secrets.EC2_USER || env.DEFAULT_USER }}
        run: |
          echo "Checking system endpoints via SSH tunnel..."
          ssh $USER@$HOST "curl -s http://localhost/ready"
          echo "Deployment successfully finished."
